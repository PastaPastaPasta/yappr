<!doctype html>
<meta charset="utf-8">
<title>DM v5 invite scan benchmark</title>
<pre id="out">running…</pre>
<script type="importmap">
{ "imports": { "@noble/secp256k1": "/node_modules/@noble/secp256k1/index.js", "@noble/hashes/hmac.js": "/node_modules/@noble/hashes/hmac.js", "@noble/hashes/sha2.js": "/node_modules/@noble/hashes/sha2.js" } }
</script>
<script type="module">
// Serve the repo root (with node_modules installed) and open this page.
import { makeFixture, runBench } from '/scripts/bench-dm-scan-core.mjs'

const out = document.getElementById('out')
const log = (line) => { out.textContent += '\n' + line }

async function workerBench(n, workers) {
  const { priv, invites } = await makeFixture(n)
  const pool = Array.from({ length: workers }, () => new Worker('/scripts/bench-dm-scan-worker.mjs', { type: 'module' }))
  const run = () => {
    const per = Math.ceil(invites.length / workers)
    return Promise.all(pool.map((w, i) => new Promise((resolve) => {
      w.onmessage = ({ data }) => resolve(data)
      w.postMessage({ priv, invites: invites.slice(i * per, (i + 1) * per) })
    })))
  }
  await run() // warm-up
  const t = performance.now()
  const hits = (await run()).reduce((a, b) => a + b, 0)
  const trialUs = (performance.now() - t) * 1000 / invites.length
  pool.forEach((w) => w.terminate())
  const r = { mode: `${workers} workers`, n: invites.length, trialUs: +trialUs.toFixed(1),
    perSec: Math.round(1e6 / trialUs), hits }
  log(JSON.stringify(r))
  return r
}

const results = [await runBench(log)]
for (const w of [2, 4, 8]) results.push(await workerBench(4000, w))
window.__benchResult = { results, cores: navigator.hardwareConcurrency }
log('DONE')
</script>
