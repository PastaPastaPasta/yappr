# Notifications, signed in (PRD NOTIF-01 – NOTIF-05, NOTIF-09): the list
# loads, the filters switch, the settings link opens the per-type switches,
# and "Mark all as read" leaves no unread row. Nothing here writes to chain.
appId: ${APP_ID}
tags:
  - full
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/ensure-signed-in.yaml
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: notifications
- extendedWaitUntil:
    visible:
      id: notifications-filters
    timeout: 30000
# The first load reads the last 7 days.
- extendedWaitUntil:
    notVisible:
      id: notifications-loading
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "notifications-list|notifications-empty"
    timeout: 30000
- takeScreenshot: notifications
# Filters, each with its list or its empty copy. Likes is absent when turned off in Settings.
- tapOn:
    id: notifications-filters-like
    optional: true
- extendedWaitUntil:
    visible:
      id: "notifications-list|notifications-empty"
    timeout: 30000
- tapOn:
    id: notifications-filters-follow
- extendedWaitUntil:
    visible:
      id: "notifications-list|notifications-empty"
    timeout: 30000
- tapOn:
    id: notifications-filters-all
- extendedWaitUntil:
    visible:
      id: "notifications-list|notifications-empty"
    timeout: 30000
# The settings link opens the per-type switches.
- tapOn:
    id: notifications-settings
- extendedWaitUntil:
    visible: "In-app notifications"
    timeout: 20000
- assertVisible:
    id: notification-toggle-likes
# The switches open on the Notifications tab's own stack (D-L4a-004), not on Profile.
- assertVisible:
    id: tab-notifications
    selected: true
# Re-tapping the active tab pops back to the list (UX_SPEC §3.1).
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: notifications
# Mark all as read (NOTIF-05): no unread row is left. The button shows only while something
# is unread, and nothing in this suite makes a notification for the app's persona on demand,
# so it is tapped (not optionally) whenever it shows once the list has loaded. The pool
# personas' inboxes keep unread rows, and every green run so far tapped it.
- extendedWaitUntil:
    visible:
      id: notifications-mark-all
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: notifications-mark-all
    commands:
      - tapOn:
          id: notifications-mark-all
- extendedWaitUntil:
    notVisible:
      id: unread-dot
    timeout: 20000
