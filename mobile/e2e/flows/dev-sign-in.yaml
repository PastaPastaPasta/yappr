# Dev quick sign-in on Settings > Diagnostics (devnet dev builds only).
# Run: maestro test -e YAPPR_KEY=<private key, WIF or hex> mobile/e2e/flows/dev-sign-in.yaml
# The key comes only from the environment; never commit one.
appId: pr.yap.app.dev
---
- openLink: "yappr-dev:///settings/diagnostics"
- scrollUntilVisible:
    element:
      id: "dev-sign-in-key"
    direction: DOWN
- tapOn:
    id: "dev-sign-in-key"
- eraseText: 200
- inputText: ${YAPPR_KEY}
# Close the keyboard first, so the tap reaches the button.
- tapOn: "Signed in as"
- scrollUntilVisible:
    element:
      id: "dev-sign-in"
    direction: DOWN
- tapOn:
    id: "dev-sign-in"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 30000
