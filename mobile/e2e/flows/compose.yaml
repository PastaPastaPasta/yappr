# Compose (PRD COMP-01 – COMP-11, EXECUTION S4): a post, a reply and a
# 3-part thread on devnet (sakura), each landing with its toast; on Android
# also the offline state (Post disabled, "You're offline").
#
# Writes real posts: run it only with a pool persona's key, on the devnet
# variant, never testnet:
#   maestro test -e YAPPR_KEY=<private key> mobile/e2e/flows/compose.yaml
# The key comes only from the environment; never commit one. Until the feed
# PR lands, posts are checked on the dev gallery's live For You feed.
appId: pr.yap.app.dev
---
- runFlow: dev-sign-in.yaml
- evalScript: ${output.run = Date.now().toString(36)}

# A post: Post stays disabled until there is text, compose closes on Post,
# and the post is at the top of the feed at once.
- openLink: "yappr-dev:///"
- tapOn:
    id: "compose-fab"
- extendedWaitUntil:
    visible:
      id: "compose-screen"
    timeout: 15000
# Start clean: a saved draft from an earlier run is deleted.
- tapOn:
    id: "compose-close"
- tapOn:
    text: "Delete draft"
    optional: true
- tapOn:
    id: "compose-fab"
- extendedWaitUntil:
    visible:
      id: "compose-screen"
    timeout: 15000
- assertVisible:
    id: "compose-post"
    enabled: false
- tapOn:
    id: "compose-input-0"
- inputText: "Maestro post ${output.run} #mobile"
- assertVisible:
    id: "compose-post"
    enabled: true
- tapOn:
    id: "compose-post"
- assertNotVisible:
    id: "compose-screen"
- openLink: "yappr-dev:///__gallery?section=live"
- extendedWaitUntil:
    visible: ".*Maestro post ${output.run}.*"
    timeout: 30000
# Confirmed: the write-status row gives way to the action bar.
- extendedWaitUntil:
    notVisible:
      id: "write-status"
    timeout: 60000

# A reply to it: the target preview and "Reply".
- tapOn:
    id: "reply-btn-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "compose-reply-context"
    timeout: 15000
- assertVisible: "Reply"
- assertNotVisible:
    id: "compose-add-part"
- tapOn:
    id: "compose-input-0"
- inputText: "Maestro reply ${output.run}"
- tapOn:
    id: "compose-post"
- extendedWaitUntil:
    visible: "Reply posted"
    timeout: 60000

# A 3-part thread: "Post all (3)", then "Thread with 3 posts created!".
- openLink: "yappr-dev:///"
- tapOn:
    id: "compose-fab"
- extendedWaitUntil:
    visible:
      id: "compose-screen"
    timeout: 15000
- tapOn:
    id: "compose-input-0"
- inputText: "Maestro thread ${output.run} 1/3"
- tapOn:
    id: "compose-add-part"
- inputText: "Maestro thread ${output.run} 2/3"
- tapOn:
    id: "compose-add-part"
- inputText: "Maestro thread ${output.run} 3/3"
- assertVisible: "Post all (3)"
- tapOn:
    id: "compose-post"
- openLink: "yappr-dev:///__gallery?section=live"
- extendedWaitUntil:
    visible: "Thread with 3 posts created!"
    timeout: 90000

# Offline (Android: the airplane-mode toggle): Post disabled with the hint;
# closing keeps nothing behind.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - openLink: "yappr-dev:///"
      - tapOn:
          id: "compose-fab"
      - tapOn:
          id: "compose-input-0"
      - inputText: "Offline ${output.run}"
      - extendedWaitUntil:
          visible: "You're offline"
          timeout: 15000
      - assertVisible:
          id: "compose-post"
          enabled: false
      - tapOn:
          id: "compose-close"
      - tapOn: "Delete draft"
      - setAirplaneMode: disabled
