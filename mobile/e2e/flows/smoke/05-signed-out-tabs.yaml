# Signed out, the account tabs explain themselves (PRD AUTH-02, NOTIF-01,
# DM-01, PROF-01): Notifications, Messages and Profile each show their sign-in
# placeholder and no list. Read only.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: ../../subflows/launch.yaml
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: notifications
- assertVisible:
    id: signed-out-notifications
- assertNotVisible:
    id: notifications-list
- takeScreenshot: notifications-signed-out
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: messages
- assertVisible:
    id: messages-signed-out
- assertNotVisible:
    id: messages-list
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: profile
- assertVisible:
    id: signed-out-profile
- takeScreenshot: profile-signed-out
