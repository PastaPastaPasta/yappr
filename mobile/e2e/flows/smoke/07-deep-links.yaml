# Deep links (UX_SPEC §3.5; EXECUTION M8): web-form links, which every build
# accepts, open their screen from a cold start and while the app runs; a
# malformed one lands on Home. Read only.
#   TAG         the hashtag the cold link opens
#   PROFILE_ID  optional: an identity id the warm profile link opens
appId: ${APP_ID}
tags:
  - smoke
env:
  TAG: ${TAG || 'mobile'}
  PROFILE_ID: ${PROFILE_ID || ''}
---
# Cold: the app is stopped and the link starts it. A dev client first has to
# load its bundle from Metro; it hands the link over once the app is up.
- runFlow: ../../subflows/launch.yaml
- stopApp
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://hashtag?tag=${TAG}
- runFlow:
    when:
      true: ${DEV_CLIENT_URL != ''}
    file: ../../subflows/dev-client.yaml
- extendedWaitUntil:
    visible:
      id: "hashtag-posts|hashtag-posts-empty|hashtag-posts-loading"
    timeout: 120000
- assertVisible: "#${TAG}"
- takeScreenshot: deep-link-cold-hashtag

# Warm: links push onto the running app.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://settings?section=appearance
- extendedWaitUntil:
    visible:
      id: appearance-settings
    timeout: 30000
- runFlow:
    when:
      true: ${PROFILE_ID != ''}
    commands:
      - runFlow:
          file: ../../subflows/open-link.yaml
          env:
            LINK: ${SCHEME}://user?id=${PROFILE_ID}
      # The link opened the profile screen; its data comes from sakura, which fails a
      # read now and then ("Something went wrong", profile-error). Then, as a user
      # would: wait a moment and "Try again" (a refetch keeps the error up until it
      # lands, so wait for the header itself; that wait counts from the tap). Only the
      # header passes. A failing read can take a minute to give up (58 s in android-full-3).
      - extendedWaitUntil:
          visible:
            id: "profile-header|profile-error"
          timeout: 90000
      - repeat:
          times: 3
          while:
            visible:
              id: profile-error
          commands:
            - takeScreenshot: deep-link-warm-profile-error
            - runScript:
                file: ../../scripts/pause.js
                env:
                  PAUSE_MS: '10000'
            # The only "Try again" on screen (Android flattens profile-error's children
            # into siblings, so it can't be matched as its child).
            - tapOn: "Try again"
            - extendedWaitUntil:
                visible:
                  id: profile-header
                timeout: 60000
                optional: true
      - assertVisible:
          id: profile-header
      - takeScreenshot: deep-link-warm-profile
# A malformed id is refused: Home, not an error screen.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://post?id=not-a-post-id
- extendedWaitUntil:
    visible:
      id: home-header
    timeout: 30000
