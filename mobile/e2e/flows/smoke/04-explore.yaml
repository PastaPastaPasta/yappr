# Signed-out browse, Explore (PRD EXPL-01 – EXPL-08; ADR E8): trending, the
# ranked segments where the contract ranks likes, a people search that opens
# a profile, the recent search, and a hashtag page. Read only.
#   QUERY  a name prefix that finds at least one person (run.sh sets one per variant)
#   TAG    a hashtag; its page may be empty
appId: ${APP_ID}
tags:
  - smoke
env:
  QUERY: ${QUERY || 'sigrid'}
  TAG: ${TAG || 'mobile'}
---
- runFlow: ../../subflows/launch.yaml
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: explore
# Trending tags. The segment is remembered for the session.
- runFlow:
    when:
      visible:
        id: explore-segments
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: explore-segments-trending
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Trending"
- extendedWaitUntil:
    visible:
      id: "trending-.*|explore-trending-empty"
    timeout: 90000
- takeScreenshot: explore-trending

# Top posts and Creators where the contract ranks likes (devnet).
- runFlow:
    when:
      visible: "Creators"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: explore-segments-top
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Top"
      - extendedWaitUntil:
          visible:
            id: "more-btn-.*|explore-top-empty"
          timeout: 90000
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: explore-segments-creators
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Creators"
      - extendedWaitUntil:
          visible: "Top creators by likes received|No ranked creators yet"
          timeout: 90000

# Search a person and open the profile.
- tapOn:
    id: explore-search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 10000
# A failed name search reads as "nobody found" (lib's DPNS search returns [] on
# any error, so the People section just doesn't appear), and sakura drops a
# read now and then: search again, as a user would, up to three times. Each try
# drops a letter, since the empty answer is cached under the query it answered.
- evalScript: ${output.query = QUERY}
- repeat:
    times: 3
    while:
      notVisible:
        id: search-section-people
    commands:
      - tapOn:
          id: search-input
      - eraseText: 40
      - inputText: ${output.query}
      - pressKey: Enter
      - evalScript: ${output.query = output.query.slice(0, -1)}
      - extendedWaitUntil:
          visible:
            id: "search-section-.*|search-no-results|search-error"
          timeout: 60000
      - extendedWaitUntil:
          notVisible:
            id: search-searching
          timeout: 60000
- assertVisible:
    id: search-section-people
- takeScreenshot: explore-search
- tapOn:
    id: "search-user-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: profile-header
    timeout: 60000
- runFlow: ../../subflows/back.yaml

# The query is a recent search now.
- tapOn:
    id: search-input
- eraseText: 40
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- tapOn:
    id: search-cancel
    optional: true
- tapOn:
    id: search-back
    optional: true

# A hashtag page (a web-form link, which every build accepts); Latest, then Top where supported.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://hashtag?tag=${TAG}
- extendedWaitUntil:
    visible:
      id: "more-btn-.*|hashtag-posts-empty"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: hashtag-sort
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: hashtag-sort-top
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Top"
      - extendedWaitUntil:
          visible:
            id: "more-btn-.*|hashtag-posts-empty"
          timeout: 90000
- takeScreenshot: hashtag
