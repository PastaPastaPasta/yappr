# Settings toggles (PRD SET-01, SET-04, SET-05, SAFE-06; ADR E8). Theme and
# NSFW mode are device-wide content settings (PRD SET-09), so this runs signed
# in or out: the theme goes Dark, Light, then back to System; the NSFW mode
# goes to Hide, survives leaving and reopening Privacy & Safety, and is put
# back to Warn. Nothing here writes to chain.
# A selected radio row reads "radio button, checked" on iOS and is `checked` on Android.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: ../../subflows/launch.yaml
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: ${SCHEME}://settings
- extendedWaitUntil:
    visible:
      id: settings-root
    timeout: 60000
- assertVisible:
    id: settings-privacy
- assertVisible:
    id: settings-about

# Theme: applies at once, and the root row shows it.
- tapOn:
    id: settings-appearance
- tapOn:
    id: appearance-theme-dark
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: appearance-theme-dark
          text: "radio button, checked"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: appearance-theme-dark
          checked: true
- takeScreenshot: appearance-dark
- tapOn:
    id: appearance-theme-light
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: appearance-theme-light
          text: "radio button, checked"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: appearance-theme-light
          checked: true
- runFlow: ../../subflows/back.yaml
- assertVisible: "Appearance, Light"
- tapOn:
    id: settings-appearance
- tapOn:
    id: appearance-theme-system
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: appearance-theme-system
          text: "radio button, checked"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: appearance-theme-system
          checked: true
- runFlow: ../../subflows/back.yaml
- assertVisible: "Appearance, System"

# NSFW mode: Hide, kept after leaving the screen, then back to Warn first.
- tapOn:
    id: settings-privacy
- extendedWaitUntil:
    visible:
      id: privacy-nsfw-blur
    timeout: 30000
- tapOn:
    id: privacy-nsfw-hide
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: privacy-nsfw-hide
          text: "radio button, checked"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: privacy-nsfw-hide
          checked: true
- runFlow: ../../subflows/back.yaml
- tapOn:
    id: settings-privacy
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: privacy-nsfw-hide
            text: "radio button, checked"
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: privacy-nsfw-hide
            checked: true
          timeout: 30000
- takeScreenshot: privacy-nsfw-hide
- tapOn:
    id: privacy-nsfw-blur
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: privacy-nsfw-blur
          text: "radio button, checked"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: privacy-nsfw-blur
          checked: true
- runFlow: ../../subflows/back.yaml

# The footer network chip opens the network sheet (NET-07); Android Back closes it.
# Mainnet builds (pr.yap.app) have no chip.
- runFlow:
    when:
      true: ${APP_ID != 'pr.yap.app'}
    commands:
      - scrollUntilVisible:
          element:
            id: network-chip
          direction: DOWN
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: network-chip
            - assertVisible:
                id: network-sheet-engine
            - back
            - waitForAnimationToEnd
            - assertNotVisible:
                id: network-sheet-engine
      - tapOn:
          id: network-chip
      - assertVisible:
          id: network-sheet-engine
      - takeScreenshot: network-sheet
      # Its link opens Engine diagnostics (SET-08).
      - tapOn:
          id: network-sheet-diagnostics
      # The header's Share is always on screen; the Share diagnostics button sits below the fold.
      - extendedWaitUntil:
          visible:
            id: diagnostics-share-header
          timeout: 30000
      - takeScreenshot: engine-diagnostics
      - runFlow: ../../subflows/back.yaml

# About (SET-06): the commit, Community rules apart from the summary, the native licenses list.
- scrollUntilVisible:
    element:
      id: settings-about
    direction: UP
- tapOn:
    id: settings-about
- assertVisible:
    id: about-commit
- assertVisible:
    id: about-community-rules
# On iOS the list scrolls under the translucent tab bar, and Maestro counts a row
# behind it as visible: scrollUntilVisible then stops with the licenses row at the
# tab bar's height, and the tap lands on the Notifications tab. Scroll to the end
# of the list first, which puts its last rows above the tab bar.
- swipe:
    start: 50%, 70%
    end: 50%, 25%
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: about-licenses
    direction: DOWN
- tapOn:
    id: about-licenses
- extendedWaitUntil:
    visible:
      id: licenses-list
    timeout: 10000
- takeScreenshot: licenses
- runFlow: ../../subflows/back.yaml
- runFlow: ../../subflows/back.yaml
