# Signed-out browse, a profile (PRD PROF-01, PROF-02, PROF-05; ADR E8): the
# first post's author opens their profile, with its header, tabs and posts,
# and the followers list. Read only.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: ../../subflows/launch.yaml
- runFlow:
    file: ../../subflows/open-tab.yaml
    env:
      TAB: home
- extendedWaitUntil:
    visible:
      id: "avatar-.*"
    timeout: 90000
- tapOn:
    id: "avatar-.*"
    index: 0
# A read that fails while sakura's quorum cache lags shows the error state with
# "Try again" (PRD G-11): try once more, as a reader would, and keep the evidence.
- extendedWaitUntil:
    visible:
      id: "profile-header|profile-error"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: profile-error
    commands:
      - takeScreenshot: profile-error
      - tapOn:
          id: profile-error-action
- extendedWaitUntil:
    visible:
      id: profile-header
    timeout: 60000
- assertVisible:
    id: profile-tabs
- assertVisible:
    id: profile-follow
- extendedWaitUntil:
    visible:
      id: "profile-list-posts|profile-empty-posts"
    timeout: 60000
- takeScreenshot: profile
# The followers list.
- tapOn:
    id: profile-followers-count
- extendedWaitUntil:
    visible:
      id: "user-row-.*|connections-empty"
    timeout: 60000
- runFlow: ../../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: profile-header
    timeout: 15000
