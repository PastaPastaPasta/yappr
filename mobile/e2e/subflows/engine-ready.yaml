# Wait until the engine is up. Devnet and testnet builds show a network chip
# whose label ends with the connection state ("... Connected."); mainnet has no
# chip, so there it waits for Home's first page instead.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "network-chip|more-btn-.*"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: network-chip
    commands:
      - extendedWaitUntil:
          visible:
            id: network-chip
            text: ".*Data may be reset\\. Connected\\."
          timeout: 120000
