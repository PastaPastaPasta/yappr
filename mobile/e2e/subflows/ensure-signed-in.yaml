# Signed in as the run's persona (SELF_HANDLE), whatever the app's state:
# another account is signed out first, so a write flow never posts as an
# account that isn't a pool persona; then "Sign in" leads through the
# private-key sign-in. Ends on Settings. Needs a launched app (launch.yaml).
appId: ${APP_ID}
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: ${SCHEME}://settings
- extendedWaitUntil:
    visible:
      id: settings-root
    timeout: 30000
# While the engine restores a session, Sign in is disabled: wait for one or the other.
- extendedWaitUntil:
    visible:
      id: "settings-account|settings-sign-in"
      enabled: true
    timeout: 90000
# The account row reads "Account: <name>, @<handle>" (no balance: that is on Account).
# Maestro matches the whole label, so the handle must end it: no prefix of another handle.
- runFlow:
    when:
      visible:
        id: settings-account
      notVisible:
        id: settings-account
        text: ".*@${SELF_HANDLE}"
    file: sign-out.yaml
- runFlow:
    when:
      visible:
        id: settings-sign-in
    commands:
      - tapOn:
          id: settings-sign-in
      - runFlow: sign-in-key.yaml
      - runFlow:
          file: open-link.yaml
          env:
            LINK: ${SCHEME}://settings
- extendedWaitUntil:
    visible:
      id: settings-account
      text: ".*@${SELF_HANDLE}"
    timeout: 60000
