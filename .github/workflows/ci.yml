name: CI

on:
  push:
    branches: [master]
  # No base-branch filter: every PR gets lint/typecheck/build regardless of its
  # target (previously PRs into staging or feature branches ran no CI at all).
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

      # Offline: the App Connect set's file pins, the anchor's shape, the group id
      # derivation and the publisher's refusal decisions (docs/APP_CONNECT_CONTRACTS.md).
      - name: App Connect self-test
        run: node scripts/verify-appconnect.mjs --self-test

  browser-components:
    name: Browser Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check component fixtures
        run: |
          npx tsc --noEmit -p e2e/components/tsconfig.json
          npx tsc --noEmit -p e2e/components-qa-round1/tsconfig.json
          npx tsc --noEmit -p e2e/components-staging/tsconfig.json
          npx tsc --noEmit -p e2e/qa/tsconfig.json

      # Isolated component fixtures simulate service failures; no live network
      # credentials or Platform writes are involved in these browser checks.
      - name: Run browser component regressions
        run: |
          npm run test:components
          npm run test:release-qa

  dead-code:
    name: Dead Code (knip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Everything knip reports fails the job: unused files, dependencies,
      # exports, types and class members. Exports that are only used inside
      # their own file are exempt (knip.json: ignoreExportsUsedInFile).
      - name: Run knip
        run: npx knip

  # Blocks on any high or critical advisory in shipped (production)
  # dependencies. Dev-only tooling is omitted because it never reaches the
  # static export.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Cloudflare Pages rejects any file over 25 MiB, which only surfaced on its
      # own preview check. Fail here, with the largest files listed, instead.
      - name: Check export file sizes
        run: node scripts/check-export-sizes.mjs

      - name: Build /staging (same release set, D20)
        run: |
          rm -rf .next out
          npm run build:staging
          node scripts/check-export-sizes.mjs

      # The deploy builds /staging-old with continue-on-error; catch a broken
      # rehearsal build (env, snapshot or substitution) here instead.
      - name: Build /staging-old (D36 rehearsal set)
        run: |
          rm -rf .next out
          npm run build:staging-old
          node scripts/check-export-sizes.mjs

      # The same for /beta, the rehearsal group's v18 members.
      - name: Build /beta (rehearsal v18 set)
        run: |
          rm -rf .next out
          npm run build:beta
          node scripts/check-export-sizes.mjs

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only for master-bound changes: the suite runs against the test contracts
    # registered from master's schemas (.env.testing), so a PR into staging or
    # another branch could pair diverged app code with mismatched contracts.
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    # The scripts/ tooling has no default network (scripts/sdk-env.mjs): this
    # job runs against the /testing contracts on testnet (.env.testing).
    env:
      NETWORK: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved @playwright/test version rather than the
      # lockfile hash: the browser bundle only changes when Playwright itself
      # changes, so unrelated dependency bumps keep reusing cached browsers.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Still run on a cache hit: the browser binaries come from the cache but
      # the OS-level shared libraries (--with-deps) are not cached.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build testing bundle
        run: npm run build:testing

      # Secrets cannot be referenced from `if:`, so surface the seed phrase's
      # presence as an env flag. Fork PRs have no secret; the `write` project
      # self-skips there and only `smoke` runs.
      - name: Detect E2E seed secret
        env:
          E2E_SEED_PHRASE: ${{ secrets.E2E_SEED_PHRASE }}
        run: |
          if [ -n "$E2E_SEED_PHRASE" ]; then
            echo "HAS_SEED=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SEED=false" >> "$GITHUB_ENV"
            echo "::notice::E2E_SEED_PHRASE unavailable (fork PR?) — running smoke tests only"
          fi

      # Fails the job with an actionable message when the identity pool is
      # depleted, rather than letting the suite die mid-run on a funding error.
      - name: Check test identity balances
        if: env.HAS_SEED == 'true'
        env:
          E2E_SEED_PHRASE: ${{ secrets.E2E_SEED_PHRASE }}
        run: node scripts/provision-test-identity.mjs --check-balances

      # Spread concurrent runs across the 3-identity pool to reduce (not
      # eliminate) identity-nonce races; Playwright retries absorb the rest.
      - name: Select identity pool slot
        run: echo "E2E_IDENTITY_INDEX=$(( GITHUB_RUN_ID % 3 ))" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        env:
          E2E_SEED_PHRASE: ${{ secrets.E2E_SEED_PHRASE }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
