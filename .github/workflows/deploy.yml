name: Deploy to GitHub Pages

# Unified deploy: the Pages artifact always contains the production site
# (built from master, served at the root / yap.pr), the testing site (built
# from the same master commit against the test contracts, served under
# /testing), the staging site (built from the staging branch, served under
# /staging) and the devnet site (the same staging commit built against
# .env.devnet, served under /devnet). A push to either branch rebuilds all four
# so no deploy can wipe another.
#
# The production and testing sites are never built from an unchecked master
# tip. A run that follows a master CI run builds exactly that run's commit; a
# staging push or a manual dispatch builds the newest master commit whose CI
# run passed, so a master merge that failed CI cannot reach yap.pr through the
# next staging push. A manual dispatch can instead name any branch, tag or
# commit as `production_ref`, which is the rollback path:
#
#   gh workflow run deploy.yml -f production_ref=legacy-testnet-f42ce65
#
# A rollback holds only until the next deploy: the next staging push or master
# CI run rebuilds production from master again.

on:
  # Master deploys are gated on CI: CI runs on every push to master, and this
  # workflow starts once that run completes (see the job-level `if`). Staging
  # pushes are not gated — they deploy directly, as before.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      production_ref:
        description: >-
          Tag, branch or full 40-character commit SHA to build production (/)
          and /testing from, for example a release tag when rolling back. A
          ref other than master is deployed as given, without a CI check, and
          must contain the build:testing script. Leave as master to deploy the
          newest master commit whose CI passed.
        required: false
        default: master
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run runs only proceed when the CI run they follow passed and was
    # a real push to master (a fork PR whose head branch happens to be named
    # "master" also matches the branch filter). Staging pushes and manual
    # dispatches are unconditional.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push') }}
    outputs:
      staging_ok: ${{ steps.staging-build.outcome }}
    steps:
      # Decides which commit the production and testing sites are built from:
      #   - workflow_run: the commit of the CI run that just passed.
      #   - workflow_dispatch naming a ref other than master: that ref, as asked
      #     (rollback or an emergency redeploy).
      #   - staging push, or dispatch left at master: the newest master commit
      #     whose CI run on a push succeeded. Failing here, rather than falling
      #     back to the master tip, keeps an unchecked commit from shipping.
      # Inputs reach the shell through env so a ref name is never parsed as script.
      # A re-run of an older CI run keeps its original commit, so a workflow_run
      # that is behind the newest green master commit is moved forward to it
      # rather than rolling production back.
      - name: Resolve the production ref
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_REF: ${{ inputs.production_ref }}
        run: |
          set -euo pipefail
          latest_green() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty'
          }
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            ref="$CI_RUN_SHA"
            why="the commit of the CI run that triggered this deploy"
            newest=$(latest_green)
            if [ -n "$newest" ] && [ "$newest" != "$ref" ] \
              && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$ref...$newest" --jq .status)" = "ahead" ]; then
              ref="$newest"
              why="the newest green master commit, which is ahead of the CI run that triggered this deploy"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_REF" ] && [ "$REQUESTED_REF" != "master" ]; then
            ref="$REQUESTED_REF"
            why="the production_ref requested for this manual run"
          else
            ref=$(latest_green)
            why="the newest master commit whose CI run passed"
          fi
          if [ -z "$ref" ]; then
            echo "::error::No master commit with a passing CI run was found, so there is nothing safe to deploy to production."
            exit 1
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::The production ref contains characters that are not valid in a git ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Production and /testing build from $ref ($why)."

      # Both checkouts pin an explicit ref, so they resolve identically for
      # push, workflow_dispatch and workflow_run events (for workflow_run,
      # github.ref points at the default branch, never at the triggering run's
      # head — nothing here relies on it). The master checkout is whatever the
      # step above resolved; staging is always the branch tip.
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.ref }}
          path: master

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            master/package-lock.json
            staging/package-lock.json

      - name: Build production (master)
        working-directory: master
        run: |
          npm ci
          npm run build
        env:
          # Set BASE_PATH via GitHub repository variables
          # Leave unset for root deployments (custom domains), set to /repo-name for subpath deployments
          BASE_PATH: ${{ vars.BASE_PATH }}

      # Cloudflare Pages rejects any file over 25 MiB. master/ may be an older
      # ref that predates the script, so skip rather than fail in that case.
      - name: Check production export file sizes
        working-directory: master
        run: |
          if [ -f scripts/check-export-sizes.mjs ]; then
            node scripts/check-export-sizes.mjs
          else
            echo "::notice::scripts/check-export-sizes.mjs is not in this production ref; skipping the size check"
          fi

      # continue-on-error so a broken staging build can never block a
      # production deploy; the deploy job re-raises the failure when the
      # push that triggered this run was to staging itself.
      - name: Build staging
        id: staging-build
        continue-on-error: true
        working-directory: staging
        run: |
          npm ci
          npm run build
          mv out out-staging
        env:
          BASE_PATH: /staging

      # Same staging checkout and the same commit as the /staging build, rebuilt
      # against .env.devnet (BASE_PATH=/devnet, so client-side storage is scoped
      # to `devnet:` and stays isolated from / , /staging and /testing).
      # continue-on-error because the devnet chain is disposable and resets
      # without notice — a broken /devnet must never hold back /staging.
      - name: Build devnet (staging)
        id: devnet-build
        if: steps.staging-build.outcome == 'success'
        continue-on-error: true
        working-directory: staging
        run: |
          rm -rf .next
          npm run build:devnet
          mv out out-devnet

      # Same master checkout and the same commit as the production build, so no
      # second `npm ci` — but the production output has to be moved aside first
      # and .next dropped so the /testing build cannot inherit its artifacts.
      # Not continue-on-error: identical code must build both ways.
      - name: Build testing (master)
        working-directory: master
        run: |
          mv out out-production
          rm -rf .next
          npm run build:testing

      - name: Combine site artifact
        run: |
          echo "Production and /testing: $(git -C master rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p site
          cp -R master/out-production/. site/
          mkdir -p site/testing
          cp -R master/out/. site/testing/
          if [ "${{ steps.staging-build.outcome }}" = "success" ] && [ -d staging/out-staging ]; then
            mkdir -p site/staging
            cp -R staging/out-staging/. site/staging/
          else
            echo "::warning::staging build failed — deploying without an updated /staging"
          fi
          if [ "${{ steps.devnet-build.outcome }}" = "success" ] && [ -d staging/out-devnet ]; then
            mkdir -p site/devnet
            cp -R staging/out-devnet/. site/devnet/
          else
            echo "::warning::devnet build failed or was skipped — deploying without an updated /devnet"
          fi

      # Pages serves only site/404.html for every missing path. Generate it from
      # staging even while master still contains the older application's 404.
      - name: Install network-free deployment-aware fallback
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          node staging/scripts/write-static-404.mjs site
          node staging/scripts/write-static-404.mjs site/testing /testing

      # Expectations are kept outside the public site: they describe exactly
      # which commits, env files and snapshot hashes this deploy built.
      - name: Record monitoring expectations
        continue-on-error: true
        run: node staging/scripts/monitoring/manifest.mjs master staging monitoring-expectations.json

      - name: Save monitoring expectations
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-expectations
          path: monitoring-expectations.json
          retention-days: 90

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Redundant with `needs` (a skipped build skips this job too), but kept
    # explicit so the CI gate is readable from either job.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if the staging push did not deploy
        if: github.ref_name == 'staging' && needs.build.outputs.staging_ok != 'success'
        run: |
          echo "This run was triggered from staging but the staging build failed."
          exit 1
